# ==========================================
# 0. SECRETOS
# ==========================================
# Las credenciales NO van en este archivo (se sube a GitHub).
# Se leen de variables de entorno o de ./.env (ignorado por git).
# Copia .env.example -> .env y completalo (lo usa tambien docker compose).
spring.config.import=optional:file:./.env[.properties]

# ==========================================
# 1. CONFIGURACION GENERAL DEL SERVIDOR
# ==========================================
spring.application.name=ecommerce-muebleria
server.port=8080
app.front.url=http://localhost:8080
spring.jackson.property-naming-strategy=SNAKE_CASE

# Configuracion de archivos (Carga de fotos de muebles/productos)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-part-count=100

# ==========================================
# 2. PERSISTENCIA Y BASE DE DATOS
# ==========================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/ecommerce_total_db?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ==========================================
# 3. SEGURIDAD (Auth0 y Sesiones)
# ==========================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-q5auxkp2cqakq6jd.us.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences=https://dev-q5auxkp2cqakq6jd.us.auth0.com/api/v2/

# Configuracion de Cookies y Sesiones unificada
server.servlet.session.timeout=2880m
server.servlet.session.cookie.max-age=172800
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logs (DEBUG de seguridad expone tokens y headers: usar solo puntualmente)
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# ==========================================
# 4. INTEGRACIONES EXTERNAS
# ==========================================
# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Mercado Pago
mp.access.token=${MP_ACCESS_TOKEN}

server.forward-headers-strategy=framework
# CONFIGURACION OAUTH2 CLIENT
spring.security.oauth2.client.registration.auth0.client-id=${AUTH0_CLIENT_ID}
spring.security.oauth2.client.registration.auth0.client-secret=${AUTH0_CLIENT_SECRET}
spring.security.oauth2.client.registration.auth0.scope=openid,profile,email
spring.security.oauth2.client.provider.auth0.issuer-uri=https://dev-q5auxkp2cqakq6jd.us.auth0.com/

# Email del administrador para recibir notificaciones de compras
app.admin.email=${ADMIN_EMAIL}

# Firebase: ruta al serviceAccountKey.json (si no se define, se busca en el classpath)
app.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
