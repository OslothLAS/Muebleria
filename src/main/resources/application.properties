# ==========================================
# 1. CONFIGURACIÓN GENERAL DEL SERVIDOR
# ==========================================
spring.application.name=ecommerce-muebleria
server.port=8080
app.front.url=http://localhost:8080
spring.jackson.property-naming-strategy=SNAKE_CASE

# Configuración de archivos (Carga de fotos de muebles/productos)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-part-count=100

# ==========================================
# 2. PERSISTENCIA Y BASE DE DATOS
# ==========================================
# Nota: Se recomienda unificar 'cart_service' y 'ecommerce_db' en una sola base de datos
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/ecommerce_total_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true

