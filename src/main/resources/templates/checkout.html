<!doctype html>
<html class="no-js" lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Datos de Envío | El Edén</title>
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/font-awesome.min.css}">
    <style>
        body { background-color: #ededed; font-family: 'Roboto', sans-serif; }
        .nav-simple { background: #1e2d42; padding: 10px 0; margin-bottom: 20px; }
        .checkout-container { background: #fff; padding: 30px; border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,.12); max-width: 800px; margin: auto; }
        .form-group { margin-bottom: 20px; }
        label { font-weight: 500; color: #666; margin-bottom: 8px; }
        .form-control { border-radius: 4px; border: 1px solid #ddd; padding: 12px; }
        .btn-pagar { background-color: #1e2d42; color: white; border: none; width: 100%; padding: 15px; font-weight: 600; border-radius: 6px; }
        .summary-mini { background: #f9f9f9; padding: 15px; border-radius: 4px; margin-bottom: 20px; }
    </style>
</head>
<body>

<nav class="nav-simple">
    <div class="container"><a href="/" style="color:white; font-weight: bold; text-decoration: none;">el edén.</a></div>
</nav>

<div class="container">
    <div class="checkout-container">
        <h2 style="font-weight: 600; margin-bottom: 25px;">¿Dónde enviamos tu compra?</h2>

        <form th:action="@{/cart/process-checkout}" method="post">
            <div class="row">
                <div class="col-md-8">
                    <div class="form-group">
                        <label>Dirección (Calle y número)</label>
                        <input type="text" name="address" class="form-control" placeholder="Ej: Av. Siempreviva 742" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Código Postal</label>
                                <input type="text" name="zipCode" class="form-control" placeholder="Ej: 1414" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Ciudad / Provincia</label>
                                <input type="text" name="city" class="form-control" placeholder="Ej: CABA" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Referencias / Piso / Depto</label>
                        <textarea name="references" class="form-control" rows="2" placeholder="Portón azul, departamento B..."></textarea>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="summary-mini">
                        <p style="font-weight: 600; border-bottom: 1px solid #ddd; padding-bottom: 5px;">Resumen</p>
                        <div class="d-flex justify-content-between">
                            <span>Productos:</span>
                            <span th:text="${'(' + myCart.items.size() + ')'}"></span>
                        </div>
                        <div class="d-flex justify-content-between mt-2" style="font-size: 18px; font-weight: 700;">
                            <span>Total:</span>
                            <span th:text="${'$' + totalAmount}"></span>
                        </div>
                    </div>
                    <button type="submit" class="btn-pagar">Continuar al Pago</button>
                    <a href="/cart" style="display: block; text-align: center; margin-top: 15px; color: #3483fa; font-size: 14px;">Editar carrito</a>
                </div>
            </div>
        </form>
    </div>
</div>
<div class="form-check">
    <input type="checkbox" id="sameAddress" onclick="clonarDireccion()">
    <label for="sameAddress">Facturar a la misma dirección de envío</label>
</div>

<script>
    function clonarDireccion() {
        const check = document.getElementById('sameAddress');
        if (check.checked) {
            document.getElementsByName('billingAddress')[0].value = document.getElementsByName('shippingAddress')[0].value;
            document.getElementsByName('billingZipCode')[0].value = document.getElementsByName('shippingZipCode')[0].value;
            document.getElementsByName('billingCity')[0].value = document.getElementsByName('shippingCity')[0].value;
            document.getElementsByName('billingReferencesInfo')[0].value = document.getElementsByName('shippingReferencesInfo')[0].value;
        }
    }
</script>
</body>
</html>
