<!doctype html>
<html class="no-js" lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <!-- 🚀 ETIQUETA VITAL PARA EL RESPONSIVE -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos de Envío y Facturación | El Edén</title>
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/font-awesome.min.css}">
    <style>
        body { background-color: #ededed; font-family: 'Roboto', sans-serif; }
        .nav-simple { background: #1e2d42; padding: 10px 0; margin-bottom: 20px; }

        .checkout-container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
            max-width: 900px;
            margin: auto;
            margin-bottom: 40px;
        }

        .section-title { font-weight: 600; color: #1e2d42; margin-bottom: 20px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; font-size: 1.2rem;}
        .form-group { margin-bottom: 15px; }
        label { font-weight: 500; color: #666; margin-bottom: 5px; font-size: 0.9rem; }
        .form-control { border-radius: 4px; border: 1px solid #ddd; padding: 10px; }

        .btn-pagar { background-color: #1e2d42; color: white; border: none; width: 100%; padding: 15px; font-weight: 600; border-radius: 6px; margin-top: 10px; transition: 0.3s;}
        .btn-pagar:hover { opacity: 0.9; cursor: pointer; }

        .summary-mini { background: #f9f9f9; padding: 20px; border-radius: 6px; border: 1px solid #eee; position: sticky; top: 20px;}
        .checkbox-container { background-color: #eef2f5; padding: 15px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #d5e0e8; }

        /* Estilos para las cajas de método de pago */
        .payment-box { border: 1px solid #ddd; border-radius: 6px; padding: 15px; margin-bottom: 10px; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; }
        .payment-box:hover { border-color: #1e2d42; background-color: #f8f9fa; }
        .payment-box input[type="radio"] { margin-right: 12px; transform: scale(1.3); cursor: pointer;}
        .payment-box label { margin: 0; font-size: 1rem; color: #333; cursor: pointer; width: 100%; font-weight: 600;}
        .discount-badge { background-color: #28a745; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; margin-left: 10px; }

        /* Cajas de pago más compactas para el recuadro derecho */
        .payment-box-mini { padding: 10px; margin-bottom: 8px; }
        .payment-box-mini label { font-size: 0.85rem; }

        /* ========================================== */
        /* 📱 OPTIMIZACIÓN EXTREMA PARA CELULARES     */
        /* ========================================== */
        @media (max-width: 767px) {
            .checkout-container {
                padding: 20px 15px;
                margin: 0 10px 40px 10px; /* Evita que pegue con el filo de la pantalla */
            }

            h2 { font-size: 22px !important; margin-bottom: 20px !important; }
            .section-title { font-size: 1.1rem; }

            .summary-mini {
                margin-top: 30px;
                padding: 15px;
            }

            /* Ocultamos el selector de pago derecho en móvil para evitar duplicados al apilarse las columnas */
            .payment-selector-right {
                display: none !important;
            }

            .discount-badge {
                display: inline-block;
                margin-left: 0;
                margin-top: 5px;
            }

            .payment-box { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

<nav class="nav-simple">
    <div class="container text-center text-md-start">
        <a href="/" style="color:white; font-weight: bold; text-decoration: none; font-size: 1.5rem;">el edén.</a>
    </div>
</nav>

<div class="container">
    <div class="checkout-container">
        <h2 style="font-weight: 700; margin-bottom: 30px; text-align: center;">Completá tus datos</h2>

        <form th:action="@{/cart/process-checkout}" method="post">
            <div class="row">
                <!-- Columna Izquierda: Formularios -->
                <div class="col-md-8">

                    <!-- SECCIÓN 1: DATOS DE ENVÍO -->
                    <h3 class="section-title">📍 Datos de Envío</h3>

                    <div class="row">
                        <div class="col-md-8 form-group">
                            <label>Calle y Número</label>
                            <!-- Agregamos th:value apuntando a defaultShippingAddress -->
                            <input type="text" name="shippingAddress" class="form-control" placeholder="Ej: Av. Rivadavia 1234" th:value="${userProfile?.defaultShippingAddress}" required>
                        </div>
                        <div class="col-md-4 form-group">
                            <label>Código Postal</label>
                            <!-- Agregamos th:value apuntando a defaultZipCode -->
                            <input type="text" name="shippingZipCode" class="form-control" placeholder="Ej: C1033AAJ" th:value="${userProfile?.defaultZipCode}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label>Entre qué calles</label>
                            <!-- Agregamos th:value apuntando a defaultBetweenStreets -->
                            <input type="text" name="shippingBetweenStreets" class="form-control" placeholder="Ej: Lima y Salta" th:value="${userProfile?.defaultBetweenStreets}" required>
                        </div>
                        <div class="col-md-6 form-group">
                            <label>Ciudad / Provincia</label>
                            <!-- Agregamos th:value apuntando a defaultCity -->
                            <input type="text" name="shippingCity" class="form-control" placeholder="Ej: CABA" th:value="${userProfile?.defaultCity}" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Referencias adicionales / Piso / Depto</label>
                        <!-- ATENCIÓN: Los textarea en Thymeleaf usan th:text, no th:value -->
                        <textarea name="shippingReferencesInfo" class="form-control" rows="2" placeholder="Ej: Casa con rejas negras, timbre 3B..." th:text="${userProfile?.defaultReferencesInfo}"></textarea>
                    </div>

                    <!-- CHECKBOX PARA CLONAR DATOS -->
                    <div class="checkbox-container mt-4">
                        <div class="form-check custom-control custom-checkbox">
                            <input type="checkbox" class="form-check-input" id="sameAddress" onclick="clonarDireccion()">
                            <label class="form-check-label" for="sameAddress" style="font-weight: 600; color: #333; cursor: pointer;">
                                Mis datos de facturación son los mismos que los de envío
                            </label>
                        </div>
                    </div>

                    <!-- SECCIÓN 2: DATOS DE FACTURACIÓN -->
                    <h3 class="section-title mt-4">🧾 Datos de Facturación</h3>

                    <div class="row">
                        <div class="col-md-8 form-group">
                            <label>Calle y Número (Facturación)</label>
                            <input type="text" name="billingAddress" id="billingAddress" class="form-control" required>
                        </div>
                        <div class="col-md-4 form-group">
                            <label>Código Postal</label>
                            <input type="text" name="billingZipCode" id="billingZipCode" class="form-control" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label>Entre qué calles</label>
                            <input type="text" name="billingBetweenStreets" id="billingBetweenStreets" class="form-control">
                        </div>
                        <div class="col-md-6 form-group">
                            <label>Ciudad / Provincia</label>
                            <input type="text" name="billingCity" id="billingCity" class="form-control" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Referencias adicionales</label>
                        <textarea name="billingReferencesInfo" id="billingReferencesInfo" class="form-control" rows="2"></textarea>
                    </div>

                    <!-- SECCIÓN 3: MÉTODO DE PAGO (IZQUIERDA) 🚀 -->
                    <h3 class="section-title mt-5">💳 Método de Pago</h3>

                    <label class="payment-box" for="mp-left">
                        <input type="radio" name="paymentMethod" id="mp-left" value="MERCADO_PAGO" checked onclick="sincronizarMetodoPago('MERCADO_PAGO')">
                        <label for="mp-left">Mercado Pago (Tarjetas, Dinero en cuenta)</label>
                    </label>

                    <label class="payment-box" for="transfer-left">
                        <input type="radio" name="paymentMethod" id="transfer-left" value="TRANSFER" onclick="sincronizarMetodoPago('TRANSFER')">
                        <label for="transfer-left">Transferencia Bancaria <span class="discount-badge">-10% OFF</span></label>
                    </label>

                </div>

                <!-- Columna Derecha: Resumen de Compra -->
                <div class="col-md-4">
                    <div class="summary-mini">
                        <h4 style="font-weight: 600; border-bottom: 2px solid #ddd; padding-bottom: 10px; margin-bottom: 15px; font-size: 1.1rem;">Resumen de tu pedido</h4>

                        <div class="d-flex justify-content-between mb-2">
                            <span style="color: #666;">Cantidad de productos:</span>
                            <span th:text="${myCart.items.size()}" style="font-weight: 600;"></span>
                        </div>

                        <div class="d-flex justify-content-between mt-3 pt-3 mb-4" style="border-top: 1px dashed #ccc; align-items: center;">
                            <span style="font-size: 1.2rem; font-weight: 700; color: #333;">Total:</span>
                            <div style="text-align: right;">
                                <div id="discount-text" style="display: none; color: #28a745; font-size: 0.85rem; font-weight: bold; margin-bottom: -5px;">-10% aplicado</div>
                                <span id="display-total" th:data-original-total="${totalAmount}" th:text="${'$' + totalAmount}" style="font-size: 1.2rem; font-weight: 700; color: #1e2d42;"></span>
                            </div>
                        </div>

                        <!-- SELECTOR DE PAGO REPETIDO (DERECHA) - Se oculta en mobile 🚀 -->
                        <div class="payment-selector-right">
                            <h5 style="font-size: 0.9rem; font-weight: 700; color: #666; margin-bottom: 10px;">Seleccioná cómo pagar:</h5>

                            <label class="payment-box payment-box-mini" for="mp-right">
                                <input type="radio" name="paymentMethod_dummy" id="mp-right" value="MERCADO_PAGO" checked onclick="sincronizarMetodoPago('MERCADO_PAGO')">
                                <label for="mp-right">Mercado Pago</label>
                            </label>

                            <label class="payment-box payment-box-mini" for="transfer-right">
                                <input type="radio" name="paymentMethod_dummy" id="transfer-right" value="TRANSFER" onclick="sincronizarMetodoPago('TRANSFER')">
                                <label for="transfer-right">Transferencia <span style="color:#28a745; font-weight: bold;">(-10%)</span></label>
                            </label>
                        </div>

                        <button type="submit" id="btn-submit" class="btn-pagar mt-3">Ir a pagar a Mercado Pago</button>
                        <a href="/cart" style="display: block; text-align: center; margin-top: 15px; color: #3483fa; font-size: 0.9rem; text-decoration: none;">← Volver al carrito</a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
    function clonarDireccion() {
        const isChecked = document.getElementById('sameAddress').checked;

        const shipAddr = document.getElementsByName('shippingAddress')[0].value;
        const shipZip = document.getElementsByName('shippingZipCode')[0].value;
        const shipStreets = document.getElementsByName('shippingBetweenStreets')[0].value;
        const shipCity = document.getElementsByName('shippingCity')[0].value;
        const shipRef = document.getElementsByName('shippingReferencesInfo')[0].value;

        const billAddr = document.getElementById('billingAddress');
        const billZip = document.getElementById('billingZipCode');
        const billStreets = document.getElementById('billingBetweenStreets');
        const billCity = document.getElementById('billingCity');
        const billRef = document.getElementById('billingReferencesInfo');

        if (isChecked) {
            billAddr.value = shipAddr;
            billZip.value = shipZip;
            billStreets.value = shipStreets;
            billCity.value = shipCity;
            billRef.value = shipRef;

            billAddr.readOnly = true;
            billZip.readOnly = true;
            billStreets.readOnly = true;
            billCity.readOnly = true;
            billRef.readOnly = true;
        } else {
            billAddr.value = "";
            billZip.value = "";
            billStreets.value = "";
            billCity.value = "";
            billRef.value = "";

            billAddr.readOnly = false;
            billZip.readOnly = false;
            billStreets.readOnly = false;
            billCity.readOnly = false;
            billRef.readOnly = false;
        }
    }

    function sincronizarMetodoPago(method) {
        // Sincronizamos los radio buttons visualmente
        document.getElementById('mp-left').checked = (method === 'MERCADO_PAGO');
        document.getElementById('mp-right').checked = (method === 'MERCADO_PAGO');

        document.getElementById('transfer-left').checked = (method === 'TRANSFER');
        document.getElementById('transfer-right').checked = (method === 'TRANSFER');

        // Actualizamos el botón y el precio
        const totalSpan = document.getElementById('display-total');
        const discountText = document.getElementById('discount-text');
        const btnSubmit = document.getElementById('btn-submit');

        const originalTotal = parseFloat(totalSpan.getAttribute('data-original-total'));

        if (method === 'TRANSFER') {
            const discountedTotal = originalTotal * 0.90;
            totalSpan.innerText = '$' + discountedTotal.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

            discountText.style.display = 'block';
            btnSubmit.innerText = 'Confirmar pedido (Transferencia)';
            btnSubmit.style.backgroundColor = '#28a745';
        } else {
            totalSpan.innerText = '$' + originalTotal.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

            discountText.style.display = 'none';
            btnSubmit.innerText = 'Ir a pagar a Mercado Pago';
            btnSubmit.style.backgroundColor = '#1e2d42';
        }
    }
</script>

</body>
</html>
