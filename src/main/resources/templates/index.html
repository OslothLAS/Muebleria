<!doctype html>
<html class="no-js" lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Silvero | Inicio</title>

	<!-- 1. Estilos Globales -->
	<div th:replace="~{fragments :: head-css}"></div>

	<!-- 2. Estilos de las Tarjetas de Producto -->
	<div th:replace="~{fragments :: css-tarjetas}"></div>

	<!-- 3. Librería Slick CSS -->
	<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>
	<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css"/>

	<style>
		/* =========================================
           ESTILOS EXCLUSIVOS DE LA VISTA INICIO
        ========================================= */

		/* --- HTMX & SCROLL --- */
		.fade-in-scroll { opacity: 0; transform: translateY(20px); animation: fadeInUp 0.6s ease-out forwards; }
		@keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

		.htmx-indicator {
			position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
			z-index: 9999; background: rgba(255,255,255,0.9); padding: 10px 20px;
			border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.15);
			opacity: 0; transition: opacity 200ms ease-in-out; pointer-events: none;
		}
		.htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }

		#all-products { min-height: 800px; }

		/* --- COLECCIONES EL EDÉN --- */
		.single-collection {
			position: relative;
			overflow: hidden;
			border-radius: 12px;
			background: #fff;
			margin-top: 60px;
			width: 100%;
			height: 370px;
			margin-bottom: 30px;
			cursor: pointer;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15) !important;
			transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
		}
		.single-collection:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25) !important; }

		.collection-img { width: 100%; height: 450px; object-fit: cover; transition: transform 0.5s ease; }
		.single-collection:hover .collection-img { transform: scale(1.1); }

		.collection-overlay {
			position: absolute; top: 0; left: 0; width: 100%; height: 100%;
			background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
			display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
			color: #fff; opacity: 0.9; transition: 0.3s; padding: 30px; text-align: center;
		}
		.single-collection:hover .collection-overlay { background: rgba(0,0,0,0.6); }

		.collection-overlay h3 { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 24px; margin-bottom: 5px; color: #fff; text-transform: uppercase; letter-spacing: 1px; }
		.collection-overlay p { font-size: 14px; color: rgba(255,255,255,0.9); margin-bottom: 15px; font-weight: 300; }

		.btn-collection { background-color: var(--gold, #1e2d42); color: #fff !important; border: none; padding: 8px 25px; border-radius: 50px; font-size: 12px; font-weight: 700; width: fit-content; text-transform: uppercase; transition: 0.3s; }
		.btn-collection:hover { background-color: #1e2d42; letter-spacing: 1px; }

		/* --- SLIDER DE COLECCIONES --- */
		.collections-slider .slick-slide { padding: 20px 0; }
		.collections-content { padding-top: 60px; padding-left: 80px; padding-right: 80px; }
		.collections-slider:not(.slick-initialized) { display: flex; overflow: hidden; }
		.collections-slider:not(.slick-initialized) > div { width: 50%; padding: 15px; }

		/* Posición específica de flechas en Colecciones (más abiertas que en el banner) */
		.collections-slider .slick-prev-eden { left: -100px; }
		.collections-slider .slick-next-eden { right: -100px; }
	</style>
</head>

<body>

<div th:replace="~{fragments :: header-principal}"></div>
<div th:replace="~{fragments :: banner-home}"></div>

<!-- ========================================== -->
<!-- SECCIÓN COLECCIONES -->
<!-- ========================================== -->
<section id="collections-eden">
	<div class="container white-panel">
		<div class="section-header">
			<h2>Nuestras Colecciones</h2>
		</div>
		<div class="collections-slider">
			<div th:each="col : ${activeCollections}" style="padding: 0 15px;">
				<div class="single-collection">
					<a th:href="@{/collection-view/{id}(id=${col.id})}" class="collection-link">
						<img th:src="${col.imageUrl}" th:alt="${col.name}" class="collection-img">
						<div class="collection-overlay">
							<div class="overlay-text">
								<h3 th:text="${col.name}">Nombre</h3>
								<p th:text="${col.description}">Descripción breve...</p>
								<span class="btn-explore">Explorar Selección</span>
							</div>
						</div>
					</a>
				</div>
			</div>
		</div>
	</div>
</section>

<!-- ========================================== -->
<!-- SECCIÓN NUEVOS INGRESOS -->
<!-- ========================================== -->
<section id="new-arrivals">
	<div class="container white-panel">
		<div class="section-header"><h2>Nuevos Ingresos</h2></div>
		<div class="new-arrivals-content">
			<div class="row">
				<!-- Magia de Thymeleaf: Llamamos al fragmento limpio para cada producto -->
				<th:block th:each="product : ${productsNew}">
					<div th:replace="~{fragments :: cardProducto(${product})}"></div>
				</th:block>
			</div>
		</div>
	</div>
</section>

<!-- ========================================== -->
<!-- SECCIÓN PRODUCTOS DESTACADOS -->
<!-- ========================================== -->
<section id="feature">
	<div class="container white-panel">
		<div class="section-header"><h2>Productos Destacados</h2></div>
		<div class="feature-content">
			<div class="row">
				<!-- Magia de Thymeleaf: Llamamos al fragmento limpio para cada producto -->
				<th:block th:each="product : ${featuredProducts}">
					<div th:replace="~{fragments :: cardProducto(${product})}"></div>
				</th:block>
			</div>
		</div>
	</div>
</section>

<!-- ========================================== -->
<!-- FOOTER, PANEL LATERAL Y SCRIPTS -->
<!-- ========================================== -->

<!-- El footer-principal YA incluye jQuery, Bootstrap, Custom JS y la lógica inicial del Slider -->
<div th:replace="~{fragments :: footer-principal}"></div>

<!-- El sideCartPanel YA incluye el div .cart-overlay en su interior -->
<div th:replace="~{fragments :: sideCartPanel}"></div>

<!-- Solo nos faltaba cargar la librería principal de Slick JS -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>

</body>
</html>
