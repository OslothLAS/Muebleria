<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Compras | El Edén</title>

    <th:block th:replace="~{fragments :: head-css}"></th:block>

    <style>
        /* Ajuste de contenedor principal para móviles */
        .orders-container { max-width: 1000px; margin-top: 40px; margin-bottom: 80px; padding: 0 15px; }

        /* Estilo tabla Silvero */
        .table-responsive-wrapper {
            background: #fff; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            overflow-x: auto; /* 🚀 ESTO HACE QUE LA TABLA NO ROMPA LA PANTALLA */
            width: 100%;
        }
        .table-silvero { border-radius: 8px; width: 100%; min-width: 600px; background-color: #fff; }
        .table-silvero thead { background-color: #1e2d42; color: white; }
        .table-silvero thead th { border: none; font-weight: 500; padding: 15px; text-align: left; }
        .table-silvero tbody td { vertical-align: middle; padding: 15px; border-bottom: 1px solid #eee; color: #555; }

        /* Botón responsive */
        .btn-outline-silvero {
            color: #1e2d42; border: 1px solid #1e2d42; border-radius: 4px;
            padding: 8px 12px; font-size: 12px; font-weight: 600; text-decoration: none; display: inline-block;
        }

        /* Badges responsive */
        .badge-base { padding: 5px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; white-space: nowrap; }
        .badge-aprobado { background-color: #d4edda; color: #155724; }
        .badge-pendiente { background-color: #fff3cd; color: #856404; }
        .badge-en-camino { background-color: #e3f2fd; color: #1976d2; }
        .badge-entregado { background-color: #e8f5e9; color: #2e7d32; }
        .badge-cancelado { background-color: #f8d7da; color: #721c24; }

        /* 🚀 MEDIA QUERY PARA CELULARES */
        @media (max-width: 576px) {
            .orders-container { margin-top: 20px; }
            h2 { font-size: 22px !important; }
            .table-silvero thead th, .table-silvero tbody td { padding: 10px; font-size: 13px; }
            .btn-outline-silvero { padding: 6px 10px; font-size: 11px; }
        }
    </style>
</head>
<body style="background-color: #F8F9FA;">

<th:block th:replace="~{fragments :: header-principal}"></th:block>

<div class="container orders-container">
    <h2 style="margin-bottom: 25px; color: #333; font-weight: 700;">📦 Mis Pedidos</h2>

    <div th:if="${#lists.isEmpty(orders)}" style="background-color: #fff; border-left: 4px solid #1e2d42; padding: 20px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
        <span style="color: #555; font-size: 16px;">No has realizado ninguna compra todavía.</span>
        <a href="/products" style="color: #1e2d42; font-weight: bold; margin-left: 10px; text-decoration: underline;">Ir a la tienda</a>
    </div>

    <!-- 🚀 Wrapper que permite el scroll horizontal en móviles -->
    <div th:unless="${#lists.isEmpty(orders)}" class="table-responsive-wrapper">
        <table class="table-silvero">
            <thead>
            <tr>
                <th># Orden</th>
                <th>Fecha</th>
                <th>Estado</th>
                <th>Total</th>
                <th style="text-align: center;">Acción</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td style="font-weight: 700; color: #1e2d42;" th:text="${'ORD-' + order.id}">ORD-001</td>
                <td th:text="${#temporals.format(order.dateCreated, 'dd/MM/yy HH:mm')}">Fecha</td>
                <td>
                    <span class="badge-base badge-aprobado" th:if="${order.status == 'APPROVED'}">Aprobado</span>
                    <span class="badge-base badge-pendiente" th:if="${order.status == 'PENDING' or order.status == 'PENDING_TRANSFER'}">Pendiente</span>
                    <span class="badge-base badge-en-camino" th:if="${order.status == 'EN_CAMINO'}">En camino</span>
                    <span class="badge-base badge-entregado" th:if="${order.status == 'ENTREGADO'}">Entregado</span>
                    <span class="badge-base badge-cancelado" th:if="${order.status == 'CANCELLED'}">Cancelado</span>
                </td>
                <td style="font-weight: 700; color: #333;" th:text="${'$' + #numbers.formatDecimal(order.totalAmount, 1, 'POINT', 2, 'COMMA')}">$0.00</td>
                <td style="text-align: center;">
                    <a th:href="@{/order-details/{id}(id=${order.id})}" class="btn-outline-silvero">Ver detalle</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<th:block th:replace="~{fragments :: footer-principal}"></th:block>

</body>
</html>
