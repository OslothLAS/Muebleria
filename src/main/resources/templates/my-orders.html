<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Mis Compras | El Edén</title>

    <!-- 🚀 1. Traemos TODOS tus estilos y fuentes originales -->
    <th:block th:replace="~{fragments :: head-css}"></th:block>

    <style>
        /* 🚀 2. Ajustamos la tabla para que use tu color corporativo #1e2d42 */
        .table-silvero {
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 0;
            width: 100%;
            background-color: #fff;
        }
        .table-silvero thead {
            background-color: #1e2d42; /* Tu color azul oscuro */
            color: white;
        }
        .table-silvero thead th {
            border: none;
            font-weight: 500;
            padding: 15px;
        }
        .table-silvero tbody td {
            vertical-align: middle;
            padding: 15px;
            border-bottom: 1px solid #eee;
            color: #555;
        }

        /* Badges de estado de envío */
        .badge-en-camino { background-color: #e3f2fd; color: #1976d2; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .badge-entregado { background-color: #e8f5e9; color: #2e7d32; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; text-transform: uppercase; }

        .btn-outline-silvero {
            color: #1e2d42;
            border: 1px solid #1e2d42;
            border-radius: 4px;
            padding: 6px 15px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-outline-silvero:hover {
            color: #3d5a83;
            border: 1px solid #365075;
            border-radius: 4px;
            padding: 6px 15px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        /* Badges de estado de envío y pago */
        .badge-aprobado { background-color: #d4edda; color: #155724; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .badge-pendiente { background-color: #fff3cd; color: #856404; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .badge-en-camino { background-color: #e3f2fd; color: #1976d2; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .badge-entregado { background-color: #e8f5e9; color: #2e7d32; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body style="background-color: #F8F9FA;"> <!-- Fondo gris clarito para resaltar la tarjeta blanca -->

<!-- 🚀 3. Agregamos tu barra de navegación (Header) -->
<th:block th:replace="~{fragments :: header-principal}"></th:block>

<div class="container" style="max-width: 1000px; margin-top: 60px; margin-bottom: 100px;">
    <h2 style="margin-bottom: 30px; color: #333; font-weight: 700;">📦 Mis Pedidos</h2>

    <!-- Mensaje si la lista está vacía -->
    <div th:if="${#lists.isEmpty(orders)}" style="background-color: #fff; border-left: 4px solid #1e2d42; padding: 20px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
        <span style="color: #555; font-size: 16px;">No has realizado ninguna compra todavía.</span>
        <a href="/products" style="color: #1e2d42; font-weight: bold; margin-left: 10px; text-decoration: underline;">Ir a la tienda</a>
    </div>

    <!-- Tabla de compras -->
    <div th:unless="${#lists.isEmpty(orders)}" style="background: #fff; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden;">
        <table class="table-silvero">
            <thead>
            <tr>
                <th># Orden</th>
                <th>Fecha</th>
                <th>Estado del Envío</th>
                <th>Total</th>
                <th style="text-align: center;">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td style="font-weight: 700; color: #1e2d42;" th:text="${'ORD-' + order.id}">ORD-001</td>

                <!-- Tu variable original dateCreated formateda -->
                <td th:text="${#temporals.format(order.dateCreated, 'dd/MM/yyyy HH:mm')}">Fecha</td>

                <!-- 🚀 4. Reemplazamos Aprobado/Pendiente por los estados de envío -->
                <!-- 🚀 4. Mapeo dinámico de todos los estados posibles -->
                <!-- 🚀 Mapeo corregido: Solo comparamos el String directamente -->
                <td>
                    <span class="badge-aprobado" th:if="${order.status != null and order.status == 'APPROVED'}">Aprobado</span>
                    <span class="badge-pendiente" th:if="${order.status != null and order.status == 'PENDING'}">Pendiente de Pago</span>
                    <span class="badge-en-camino" th:if="${order.status != null and order.status == 'EN_CAMINO'}">En camino</span>
                    <span class="badge-entregado" th:if="${order.status != null and order.status == 'ENTREGADO'}">Entregado</span>
                </td>
                <!-- Formateamos el precio estilo Argentina -->
                <td style="font-weight: 700; color: #333;" th:text="${'$' + #numbers.formatDecimal(order.totalAmount, 1, 'POINT', 2, 'COMMA')}">$1000.00</td>

                <td style="text-align: center;">
                    <a th:href="@{/order-details/{id}(id=${order.id})}" class="btn-outline-silvero">Ver Detalles</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- 🚀 5. Agregamos tu Footer -->
<th:block th:replace="~{fragments :: footer-principal}"></th:block>

</body>
</html>
