<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mis Compras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="shortcut icon" type="image/icon" th:href="@{/assets/logo/favicon.png}"/>
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="mb-4">📦 Mis Pedidos</h2>

    <div th:if="${#lists.isEmpty(orders)}" class="alert alert-info">
        No has realizado ninguna compra todavía. <a href="/">Ir a comprar</a>
    </div>

    <div th:unless="${#lists.isEmpty(orders)}" class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-dark">
                <tr>
                    <th># Orden</th>
                    <th>Fecha</th>
                    <th>Estado</th>
                    <th>Total</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders}">
                    <td th:text="${'ORD-' + order.id}">ORD-001</td>
                    <td th:text="${#temporals.format(order.dateCreated, 'dd-MM-yyyy HH:mm')}">Fecha</td>
                    <td>
                        <span class="badge bg-success" th:if="${order.status == 'APPROVED'}">Aprobado</span>
                        <span class="badge bg-warning" th:if="${order.status == 'PENDING'}">Pendiente</span>
                    </td>
                    <td class="fw-bold" th:text="${'$' + order.totalAmount}">$1000</td>
                    <td>
                        <a th:href="@{/order-details/{id}(id=${order.id})}" class="btn btn-sm btn-outline-primary">Ver Detalles</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="mt-3">
        <a href="/" class="btn btn-secondary">Volver a la tienda</a>
    </div>
</div>

</body>
</html>
