<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesión | Silvero</title>

    <th:block th:replace="~{fragments :: head-css}"></th:block>

    <style>
        /* Estilos Silvero */
        body { background-color: #ededed; }
        .login-section { padding: 80px 0; min-height: 85vh; display: flex; align-items: center; }
        .login-card { background: #fff; padding: 50px 40px; border-radius: 6px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); max-width: 480px; margin: 0 auto; }

        .login-header { text-align: center; margin-bottom: 35px; }
        .login-header h1 { font-family: 'Roboto', sans-serif; font-size: 30px; font-weight: 700; color: #333; margin-bottom: 10px; }
        .login-header p { color: #777; font-size: 15px; }

        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #555; font-size: 14px; text-transform: uppercase; }
        .form-control-custom { width: 100%; height: 50px; padding: 0 20px; border: 1px solid #e0e0e0; border-radius: 4px; font-size: 15px; color: #333; background: #f9f9f9; transition: all 0.3s; }
        .form-control-custom:focus { border-color: #e69500; background: #fff; outline: none; }

        .login-btn { width: 100%; height: 55px; background: #e69500; color: #fff; border: none; border-radius: 4px; font-size: 16px; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease; margin-top: 10px; }
        .login-btn:hover { background: #333; }

        /* Alerta de error (Estilo Silvero) */
        .alert-error {
            background-color: #ffe6e6;
            color: #d9534f;
            padding: 12px;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 25px;
            border: 1px solid #ffcccc;
            text-align: center;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments :: header-simple}"></div>

<main class="login-section">
    <div class="container">
        <div class="login-card">

            <div class="login-header">
                <h1>Iniciar Sesión</h1>
                <p>Accede a tu cuenta de Silvero</p>
            </div>

            <div th:if="${param.error}" class="alert-error">
                <i class="fa fa-exclamation-circle"></i> Usuario o contraseña incorrectos
            </div>

            <form class="login-form" th:action="@{/auth/login-submit}" method="post">

                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" class="form-control-custom" placeholder="Ej: osmi" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-control-custom" placeholder="Ingresa tu contraseña" required>
                </div>

                <button type="submit" class="login-btn">
                    Ingresar
                </button>
            </form>

            <div class="form-footer" style="text-align: center; margin-top: 25px;">
                <p>¿No tienes una cuenta? <a href="/register" style="color: #e69500; font-weight: 700;">Regístrate aquí</a></p>
            </div>

        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer-principal}"></div>
</body>
</html>
