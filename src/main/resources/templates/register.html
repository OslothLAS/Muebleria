<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Silvero</title>

    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #f59e0b; /* Naranja Silvero */
            --primary-hover: #d97706;
            --text-color: #1f2937;
            --text-light: #6b7280;
            --background: #f3f4f6;
            --surface: #ffffff;
            --border: #e5e7eb;
            --error-bg: #fee2e2;
            --error-text: #ef4444;
            --success-bg: #dcfce7;
            --success-text: #166534;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--background);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* HEADER SIMPLE */
        .header-simple {
            width: 100%;
            padding: 1.5rem 0;
            text-align: center;
            margin-bottom: 1rem;
        }

        .brand-logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: #333;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* TARJETA DE REGISTRO */
        .register-container {
            width: 100%;
            max-width: 480px;
            padding: 0 1rem;
            margin-bottom: 3rem;
        }

        .register-card {
            background: var(--surface);
            padding: 2.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border);
        }

        .register-header { text-align: center; margin-bottom: 2rem; }
        .register-header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        .register-header p { color: var(--text-light); font-size: 0.95rem; }

        /* FORMULARIO */
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.4rem; }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            background-color: #fafafa;
            transition: all 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
        }

        /* ALERTAS DE THYMELEAF */
        .alert-box {
            padding: 0.8rem;
            border-radius: 6px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            text-align: center;
            font-weight: 500;
        }
        .alert-error {
            background-color: var(--error-bg);
            color: var(--error-text);
            border: 1px solid #fca5a5;
        }
        .alert-success {
            background-color: var(--success-bg);
            color: var(--success-text);
            border: 1px solid #86efac;
        }

        /* BOTÓN */
        .register-btn {
            width: 100%;
            padding: 0.85rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            margin-top: 1rem;
            transition: background-color 0.2s;
        }
        .register-btn:hover { background-color: var(--primary-hover); }

        .login-link { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-light); }
        .login-link a { color: var(--primary-color); font-weight: 600; text-decoration: none; }
        .login-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<header class="header-simple">
    <a th:href="@{/}" class="brand-logo">
        <i data-lucide="box"></i>
        Silvero
    </a>
</header>

<main class="register-container">
    <div class="register-card">
        <div class="register-header">
            <h1>Crear una cuenta</h1>
            <p>Completa tus datos para unirte a Silvero.</p>
        </div>

        <form th:action="@{/register}" method="post">

            <div th:if="${error}" class="alert-box alert-error">
                <span th:text="${error}">Error en el registro</span>
            </div>
            <div th:if="${mensaje}" class="alert-box alert-success">
                <span th:text="${mensaje}">Registro exitoso</span>
            </div>

            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Osmar" required>
            </div>

            <div class="form-group">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido" placeholder="Ej: Silvero" required>
            </div>

            <div class="form-group">
                <label for="fechaNacimiento">Fecha De Nacimiento</label>
                <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
            </div>

            <div class="form-group">
                <label for="username">Correo Electrónico (Usuario)</label>
                <input type="text" id="username" name="username" placeholder="example@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="contrasenia">Contraseña</label>
                <input type="password" id="contrasenia" name="contrasenia" placeholder="........" required minlength="6">
            </div>

            <button type="submit" class="register-btn">REGISTRARME</button>
        </form>

        <div class="login-link">
            ¿Ya Tienes Cuenta? <a th:href="@{/login}">Inicia Sesión</a>
        </div>
    </div>
</main>

<script>
    // Inicializar iconos
    lucide.createIcons();
</script>
</body>
</html>
