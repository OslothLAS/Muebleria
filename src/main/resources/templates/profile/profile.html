<!doctype html>
<html class="no-js" lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <!-- Meta viewport vital para que la responsividad funcione en celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

    <title>Mi Perfil | Silvero</title>

    <!-- Traemos tu bloque de estilos y librerías -->
    <th:block th:replace="~{fragments :: head-css}"></th:block>

    <!-- Estilos específicos para esta pantalla -->
    <style>
        .profile-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .profile-avatar {
            border-radius: 50%;
            width: 120px;
            height: 120px;
            object-fit: cover;
            border: 3px solid #1e2d42;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .form-section-title {
            color: #1e2d42;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
            font-size: 20px;
        }
        .btn-guardar {
            background-color: #1e2d42;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 50px; /* Estilo píldora como el resto de tu web */
            font-weight: 600;
            width: 100%; /* Por defecto 100% para celular */
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(30, 45, 66, 0.15);
        }
        .btn-guardar:hover {
            background-color: #131c29;
            color: white;
            transform: translateY(-2px);
        }

        /* 💻 Comportamiento en Escritorio y Tablets grandes */
        @media (min-width: 768px) {
            .btn-guardar {
                width: auto; /* Deja de ocupar el 100% en pantallas grandes */
            }
            .form-actions {
                text-align: right;
            }
        }
    </style>
</head>

<body>

<!-- Tu Header Nav -->
<div th:replace="~{fragments :: header-principal}"></div>

<section style="min-height: 80vh; padding: 40px 0;">
    <div class="container">
        <div class="row">

            <!-- 📱 COLUMNA IZQUIERDA: Resumen (Auth0) -->
            <!-- Nota: En celular (xs) ocupa 12 columnas. En escritorio (md) ocupa 4 -->
            <div class="col-md-4 col-sm-12 col-xs-12" style="margin-bottom: 20px;">
                <div class="white-panel profile-header">
                    <!-- Mostramos la foto de Auth0, o un avatar por defecto si no tiene -->
                    <img th:if="${usuarioAuth0['picture'] != null}" th:src="${usuarioAuth0['picture']}" alt="Foto de perfil" class="profile-avatar">
                    <img th:unless="${usuarioAuth0['picture'] != null}" src="https://ui-avatars.com/api/?name=Usuario&background=1e2d42&color=fff" alt="Foto de perfil" class="profile-avatar">

                    <h3 th:text="${usuarioAuth0['name']}" style="margin-bottom: 5px; font-weight: 700; font-size: 22px;">Usuario</h3>
                    <!-- word-break para que si el email es muy largo no rompa la tarjeta en el celular -->
                    <p style="color: #666; font-size: 14px; margin-bottom: 25px; word-break: break-all;" th:text="${usuarioAuth0['email']}">email@ejemplo.com</p>

                    <a href="/my-orders" class="btn" style="background-color: #f8f9fa; color: #1e2d42; border: 1.5px solid #ddd; width: 100%; padding: 10px; border-radius: 5px; font-weight: 600; transition: 0.3s;">
                        <i class="fa fa-shopping-bag"></i> Ver Mis Compras
                    </a>
                </div>
            </div>

            <!-- 📱 COLUMNA DERECHA: Formulario Base de Datos -->
            <!-- En celular ocupa 12, en escritorio ocupa 8 -->
            <div class="col-md-8 col-sm-12 col-xs-12">
                <div class="white-panel">
                    <h3 class="form-section-title">Mis Datos Personales</h3>

                    <!-- Mensaje de éxito verde cuando se guardan los datos -->
                    <div th:if="${mensaje}" th:classappend="'alert alert-' + ${clase}" style="padding: 15px; border-radius: 4px; margin-bottom: 20px;">
                        <span th:text="${mensaje}"></span>
                    </div>

                    <!-- Formulario mapeado con la entidad UserProfile -->
                    <form th:action="@{/profile/save}" th:object="${userProfile}" method="post">

                        <div class="row">
                            <div class="col-md-6 col-sm-6 col-xs-12 form-group">
                                <label>Nombre</label>
                                <input type="text" th:field="*{firstName}" class="form-control" placeholder="Ej: Juan">
                            </div>
                            <div class="col-md-6 col-sm-6 col-xs-12 form-group">
                                <label>Apellido</label>
                                <input type="text" th:field="*{lastName}" class="form-control" placeholder="Ej: Pérez">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 col-sm-6 col-xs-12 form-group">
                                <label>Teléfono de Contacto</label>
                                <input type="tel" th:field="*{phone}" class="form-control" placeholder="Ej: 11 1234 5678">
                            </div>
                            <div class="col-md-6 col-sm-6 col-xs-12 form-group">
                                <label>DNI / CUIT</label>
                                <input type="text" th:field="*{documentNumber}" class="form-control" placeholder="Documento para envíos">
                            </div>
                        </div>

                        <h3 class="form-section-title" style="margin-top: 30px;">Datos de Envío por Defecto</h3>

                        <div class="form-group">
                            <label>Dirección</label>
                            <input type="text" th:field="*{defaultShippingAddress}" class="form-control" placeholder="Calle y número. Ej: Av. Corrientes 1234">
                        </div>

                        <div class="row">
                            <div class="col-md-4 col-sm-4 col-xs-12 form-group">
                                <label>Ciudad / Localidad</label>
                                <input type="text" th:field="*{defaultCity}" class="form-control" placeholder="Tu ciudad">
                            </div>
                            <div class="col-md-4 col-sm-4 col-xs-12 form-group">
                                <label>Código Postal</label>
                                <input type="text" th:field="*{defaultZipCode}" class="form-control" placeholder="Ej: 1405">
                            </div>
                            <div class="col-md-4 col-sm-4 col-xs-12 form-group">
                                <label>Entre Calles</label>
                                <input type="text" th:field="*{defaultBetweenStreets}" class="form-control" placeholder="Opcional">
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Referencias Adicionales (Opcional)</label>
                            <textarea th:field="*{defaultReferencesInfo}" class="form-control" rows="3" placeholder="Ej: Casa con portón negro, timbre no funciona, dejar en recepción..."></textarea>
                        </div>

                        <div class="form-actions" style="margin-top: 35px;">
                            <button type="submit" class="btn-guardar">
                                <i class="fa fa-save"></i> Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</section>

<!-- Tu Footer y el panel del carrito lateral -->
<div th:replace="~{fragments :: footer-principal}"></div>
<div th:replace="~{fragments :: sideCartPanel}"></div>

</body>
</html>
