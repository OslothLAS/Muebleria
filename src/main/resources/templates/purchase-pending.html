<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pago Pendiente - Tienda Silvero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0 text-center p-5">
                <div class="mb-4">
                    <i class="bi bi-clock-history text-info" style="font-size: 5rem;"></i>
                </div>
                <h1 class="fw-bold text-dark">Pago en proceso</h1>
                <p class="text-muted mt-3">
                    Tu pago está siendo procesado por Mercado Pago.
                    Esto puede tardar unos minutos o hasta que realices el depósito en efectivo.
                </p>

                <div class="alert alert-primary mt-4" role="alert">
                    Te enviaremos un correo electrónico apenas se confirme la acreditación.
                </div>

                <div class="d-grid gap-2 mt-4">
                    <a th:href="@{/}" class="btn btn-info text-white btn-lg">
                        Ir a mis pedidos
                    </a>
                    <a th:href="@{/}" class="btn btn-link text-decoration-none">Seguir viendo muebles</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
