<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

        <div class="footer-links">
            <a href="#">Privacidad</a>
            <a href="#">Soporte</a>
        </div>
    </div>

    <style>
        .silvero-footer {
            padding: 2rem;
            background: #ffffff;

        }
        .footer-content p {

        .silver-text { color: #94a3b8; font-weight: 500; }
