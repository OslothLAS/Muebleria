<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pago Fallido - Tienda Silvero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0 text-center p-5">
                <div class="mb-4">
                    <i class="bi bi-x-circle-fill text-danger" style="font-size: 5rem;"></i>
                </div>
                <h1 class="fw-bold text-dark">¡Ups! Algo salió mal</h1>
                <p class="text-muted mt-3">
                    No pudimos procesar tu pago. Puede deberse a fondos insuficientes,
                    un error en los datos de la tarjeta o que la operación fue cancelada.
                </p>

                <div class="alert alert-warning mt-4" role="alert">
                    <i class="bi bi-info-circle-fill me-2"></i>
                    No te preocupes, tus productos siguen guardados en el carrito.
                </div>

                <div class="d-grid gap-2 mt-4">
                    <a th:href="@{/}" class="btn btn-danger btn-lg">
                        <i class="bi bi-arrow-left me-2"></i>Volver al carrito y reintentar
                    </a>
                    <a th:href="@{/}" class="btn btn-link text-decoration-none">Volver a la tienda</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
