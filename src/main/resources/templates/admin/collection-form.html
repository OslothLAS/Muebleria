<!doctype html>
<html class="no-js" lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{fragments :: head-css}"></div>
    <style>
        body { background-color: #f4f6f8; font-family: 'Roboto', sans-serif; }

        .form-container {
            background: #fff;
            border-radius: 12px;
            padding: 40px;
            margin-top: 30px;
            margin-bottom: 50px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .form-title {
            font-size: 26px;
            font-weight: 700;
            color: #333;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .form-label { font-weight: 600; font-size: 14px; color: #555; margin-bottom: 8px; display: block; }

        .form-control-custom {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px 15px;
            transition: 0.3s;
        }
        .form-control-custom:focus { border-color: #e69500; outline: none; box-shadow: 0 0 0 3px rgba(230, 149, 0, 0.1); }

        /* ZONA DE CARGA DE IMAGEN */
        .main-upload-box {
            width: 100%;
            height: 350px;
            border: 2px dashed #ccc;
            border-radius: 15px;
            background: #fafafa;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            transition: 0.3s;
        }
        .main-upload-box:hover { border-color: #e69500; background: #fffdf5; }
        .preview-img { width: 100%; height: 100%; object-fit: cover; }
        .upload-icon { font-size: 40px; color: #ccc; margin-bottom: 10px; }

        /* LISTA DE PRODUCTOS */
        .product-selector-container {
            max-height: 450px;
            overflow-y: auto;
            border: 1px solid #eee;
            padding: 10px;
            border-radius: 10px;
            background: #fafafa;
        }
        .product-item-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 8px;
            padding: 10px;
            background: #fff;
            border-radius: 8px;
            border: 1px solid #f0f0f0;
            transition: 0.2s;
        }
        .product-item-row:hover { border-color: #e69500; }

        .btn-save {
            background-color: #e69500;
            color: #fff;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            width: 100%;
            margin-top: 30px;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        .btn-save:hover { background-color: #cc8400; transform: translateY(-2px); }
    </style>
</head>
<body>

<div th:replace="~{fragments :: header-principal}"></div>

<div class="container">
    <div class="row">
        <div class="col-md-12">
            <!-- th:object="${collection}" se vincula con tu CollectionRequest -->
            <form method="post" th:action="@{/admin/collections/save}" enctype="multipart/form-data" th:object="${collection}">

                <div class="form-container">
                    <h2 class="form-title">
                        <i class="fa fa-th-large" style="color: #e69500;"></i> Nueva Colección de Diseño
                    </h2>

                    <div class="row">
                        <!-- COLUMNA IZQUIERDA: IMAGEN -->
                        <div class="col-md-5">
                            <label class="form-label">Imagen de Portada (Banner)</label>
                            <!-- name="imageFile" para el @RequestParam del Controller -->
                            <input type="file" id="colFile" name="imageFile" style="display:none;" onchange="previewCol(this)" accept="image/*">
                            <label for="colFile" class="main-upload-box">
                                <div id="phCol" class="text-center">
                                    <i class="fa fa-camera upload-icon"></i>
                                    <div style="color: #888; font-weight: 600;">SUBIR IMAGEN</div>
                                </div>
                                <img id="prevCol" class="preview-img" style="display:none;">
                            </label>
                            <p class="text-muted" style="font-size: 12px; margin-top: 10px;">
                                <i class="fa fa-info-circle"></i> Se recomienda una imagen horizontal de alta calidad para el banner.
                            </p>
                        </div>

                        <!-- COLUMNA DERECHA: DATOS -->
                        <div class="col-md-7">
                            <div class="form-group">
                                <label class="form-label">Nombre de la Colección</label>
                                <input type="text" class="form-control-custom" th:field="*{name}" placeholder="Ej: Verano Nórdico 2026" required>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Descripción Conceptual</label>
                                <textarea class="form-control-custom" th:field="*{description}" rows="4" placeholder="¿Qué inspira esta colección?"></textarea>
                            </div>

                            <!-- 🚀 SELECCIÓN DE PRODUCTOS N a N -->
                            <div class="form-group" style="margin-top: 25px;">
                                <label class="form-label" style="color: #e69500;">
                                    <i class="fa fa-check-square-o"></i> Seleccionar Productos
                                </label>
                                <div class="product-selector-container">
                                    <div class="row">
                                        <div class="col-md-6" th:each="prod : ${allProducts}">
                                            <div class="product-item-row">
                                                <!-- th:field="*{productIds}" vincula a la lista de IDs en CollectionRequest -->
                                                <input type="checkbox"
                                                       th:field="*{productIds}"
                                                       th:value="${prod.id}"
                                                       style="width: 20px; height: 20px; cursor: pointer;">

                                                <img th:src="${prod.imageUrl}" style="width: 45px; height: 45px; object-fit: contain; background: #f9f9f9; border-radius: 4px;">

                                                <div style="overflow: hidden;">
                                                    <span th:text="${prod.name}" style="font-size: 13px; font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></span>
                                                    <span th:text="'$ ' + ${prod.price}" style="font-size: 11px; color: #888;"></span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 col-md-offset-4">
                            <button type="submit" class="btn-save">
                                <i class="fa fa-save"></i> PUBLICAR COLECCIÓN
                            </button>
                        </div>
                    </div>

                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function previewCol(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) {
                var img = document.getElementById('prevCol');
                img.src = e.target.result;
                img.style.display = 'block';
                document.getElementById('phCol').style.display = 'none';
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
</body>
</html>
