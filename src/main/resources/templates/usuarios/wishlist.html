<!doctype html>
<html class="no-js" lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Silvero | Mis Favoritos</title>

    <!-- 1. Estilos Globales -->
    <th:block th:replace="~{fragments :: head-css}"></th:block>

    <!-- 2. Estilos de las Tarjetas de Producto Unificadas -->
    <th:block th:replace="~{fragments :: css-tarjetas}"></th:block>

    <style>
        .nav-btn.shop-item > a,
        .nav-btn.shop-item > a i { color: #1e2d42 !important; }

        /* Estilo específico para cuando la lista de favoritos está vacía */
        .empty-wishlist {
            text-align: center;
            padding: 50px 20px;
        }
        .empty-wishlist i {
            font-size: 60px;
            color: #ccc;
            margin-bottom: 20px;
        }
        .empty-wishlist h3 {
            font-size: 22px;
            color: #333;
            margin-bottom: 10px;
        }
        .empty-wishlist p {
            color: #777;
            font-size: 15px;
        }

        /* --- HTMX & SCROLL --- */
        .fade-in-scroll { opacity: 0; transform: translateY(20px); animation: fadeInUp 0.6s ease-out forwards; }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        .htmx-indicator {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 9999; background: rgba(255,255,255,0.9); padding: 10px 20px;
            border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            opacity: 0; transition: opacity 200ms ease-in-out; pointer-events: none;
        }
        .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }
    </style>
</head>

<body>

<!-- Header Principal -->
<div th:replace="~{fragments :: header-principal}"></div>

<!-- Sección de Favoritos -->
<section id="wishlist-container">
    <div class="container white-panel">
        <div class="section-header">
            <h2>Mis Favoritos</h2>
        </div>

        <!-- Estado Vacío -->
        <div th:if="${#lists.isEmpty(favoriteProducts)}" class="empty-wishlist">
            <i class="fa fa-heart-o"></i>
            <h3>Aún no tienes productos favoritos</h3>
            <p>Explora nuestra tienda y guarda lo que más te guste.</p>
            <br>
            <a href="/products" class="mi-btn-agregar" style="width: 200px; margin: 0 auto; background-color: #1e2d42; color: #fff;">Ir a la tienda</a>
        </div>

        <!-- Listado de Favoritos -->
        <div class="row" th:if="${not #lists.isEmpty(favoriteProducts)}">
            <!-- 🚀 Usamos tu fragmento centralizado de tarjetas para mantener la consistencia responsiva -->
            <th:block th:each="product : ${favoriteProducts}">
                <div th:replace="~{fragments :: cardProducto(${product})}"></div>
            </th:block>
        </div>
    </div>
</section>

<!-- Footer, Overlay y Carrito Lateral -->
<div th:replace="~{fragments :: footer-principal}"></div>
<div th:replace="~{fragments :: sideCartPanel}"></div>

<!-- Scripts de Lógica -->
<script th:src="@{/assets/js/cart-logic.js}"></script>
</body>
</html>
