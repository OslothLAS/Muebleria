<!doctype html>
<html class="no-js" lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Silvero | Tienda</title>

    <!-- 1. Heredamos los estilos globales del header/footer -->
    <th:block th:replace="~{fragments :: head-css}"></th:block>

    <!-- 2. Heredamos EXCLUSIVAMENTE los estilos de las tarjetas (corazón arriba, botones responsivos, etc) -->
    <th:block th:replace="~{fragments :: css-tarjetas}"></th:block>

    <style>
        /* --- ESTILOS EXCLUSIVOS DE LA TIENDA (SHOP) --- */
        body {
            background-color: #818181 !important; /* Mantenemos tu fondo gris oscuro exclusivo para la tienda */
            font-family: 'Roboto', sans-serif;
            color: #333;
        }
        #all-products { min-height: 800px; }
        .nav-btn.shop-item > a, .nav-btn.shop-item > a i { color: #1e2d42 !important; }

        /* --- HTMX & EFECTOS GLOBALES --- */
        .fade-in-scroll { opacity: 0; transform: translateY(20px); animation: fadeInUp 0.6s ease-out forwards; }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        .htmx-indicator {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 9999; background: rgba(255,255,255,0.9); padding: 10px 20px;
            border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            opacity: 0; transition: opacity 200ms ease-in-out; pointer-events: none;
        }
        .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }

        .cart-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 9998;
            visibility: hidden; opacity: 0; transition: 0.3s;
        }
        .cart-overlay.active { visibility: visible; opacity: 1; }
    </style>
</head>

<body>

<div th:replace="~{fragments :: header-principal}"></div>

<section id="all-products">
    <div class="container white-panel">

        <!-- Selector de ordenamiento -->
        <div class="row" style="margin-bottom: 20px;">
            <div class="col-md-12">
                <div style="display: flex; justify-content: flex-end; align-items: center;">
                    <label style="margin-right: 10px; color: #666; font-weight: 400;">Ordenar por:</label>
                    <form action="/products" method="get" style="margin: 0;">
                        <input type="hidden" name="keyword" th:value="${keyword}">
                        <select name="sort" class="form-control" onchange="this.form.submit()"
                                style="width: 180px; border-radius: 4px; border: 1px solid #ddd; color: #555;">
                            <option value="new" th:selected="${sort == 'new'}">Más Nuevos</option>
                            <option value="price_asc" th:selected="${sort == 'price_asc'}">Menor precio</option>
                            <option value="price_desc" th:selected="${sort == 'price_desc'}">Mayor precio</option>
                        </select>
                    </form>
                </div>
            </div>
        </div>

        <!-- Contenedor dinámico de HTMX -->
        <div id="contenedor-dinamico" th:fragment="lista-productos">
            <div class="htmx-indicator">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div class="spinner-border text-warning" role="status" style="width: 2rem; height: 2rem; color: #e69500; border-width: 3px;"></div>
                    <span style="color: #666; font-weight: 500; font-size: 14px;">Cargando más...</span>
                </div>
            </div>

            <div class="new-arrivals-content">
                <div class="row">
                    <!-- Mensaje sin productos -->
                    <div class="col-md-12 text-center" th:if="${allProducts.empty}">
                        <h3 style="color: #999; margin-top: 50px; font-weight: 300;">No se encontraron productos.</h3>
                    </div>

                    <!-- 🚀 APLICAMOS col-xs-6 col-6 PARA LAS 2 COLUMNAS EN MOBILE -->
                    <div class="col-md-3 col-sm-4 col-xs-6 col-6 product-card fade-in-scroll"
                         th:each="product, iterStat : ${allProducts}"
                         th:if="${product['activo'] != false}"
                         th:fragment="items-scroll">

                        <!-- Gatillo para carga infinita (HTMX) -->
                        <div th:if="${iterStat.last and currentPage < totalPages - 1}"
                             th:attr="hx-get=@{/products(page=${currentPage + 1}, keyword=${keyword}, sort=${sort})}"
                             hx-trigger="revealed"
                             hx-swap="afterend"
                             hx-target="closest .product-card"
                             hx-indicator=".htmx-indicator">
                        </div>

                        <!-- Estructura de la tarjeta heredando las propiedades de Fragments -->
                        <div class="single-new-arrival" th:id="'card-producto-' + ${product['id']}"
                             th:fragment="cardProducto">

                            <!-- 🚀 CORAZÓN FLOTANTE: Movido arriba de la imagen -->
                            <a href="javascript:void(0);"
                               th:fragment="btnFavorito"
                               th:with="
                               currentId=${product != null ? T(java.lang.Long).valueOf(product['id'].toString()) : productId},
                               currentFav=${isFavorite != null ? isFavorite : #lists.contains(favoritesIds ?: {}, currentId)}"
                               th:id="'btn-fav-' + ${currentId}"
                               class="mi-btn-fav"
                               th:classappend="${currentFav} ? 'activo' : ''"
                               th:onclick="'toggleFavorite(' + ${currentId} + ')'"
                               title="Añadir a favoritos">
                                <i class="fa" th:classappend="${currentFav} ? 'fa-heart' : 'fa-heart-o'"></i>
                            </a>

                            <!-- IMAGEN DEL PRODUCTO -->
                            <div class="single-new-arrival-bg">
                                <span class="label-new" th:if="${product['newProduct']}"
                                      style="position: absolute; top: 15px; left: 15px; background: #1e2d42; color: #fff; padding: 4px 12px; font-size: 11px; border-radius: 3px; z-index: 10;">
                                    Nuevo
                                </span>
                                <a th:href="@{/product/{id}(id=${product['id']})}">
                                    <img th:src="@{${product['imageUrl']}}" alt="image">
                                </a>
                            </div>

                            <!-- TEXTO Y PRECIO -->
                            <div class="single-new-arrival-caption">
                                <h4><a th:href="@{/product/{id}(id=${product['id']})}" th:text="${product['name']}">Nombre</a></h4>
                                <p class="arrival-product-price" th:text="${'$ ' + product['price']}">$0.00</p>
                            </div>

                            <!-- ACCIONES (CARRITO) -->
                            <div class="mis-acciones-producto">
                                <div style="width: 100%;"
                                     th:with="safeId=${T(java.lang.Long).valueOf(product['id'].toString())},
                                      qtyInCart=${(productQuantities != null and productQuantities.containsKey(safeId)) ? productQuantities.get(safeId) : 0}"
                                     th:id="'acciones-cart-' + ${safeId}"
                                     th:fragment="cartActionsFragment">

                                    <a href="javascript:void(0);"
                                       class="mi-btn-agregar"
                                       th:if="${qtyInCart == 0}"
                                       th:onclick="'agregarConAjax(' + ${safeId} + ')'">
                                        Agregar al carrito
                                    </a>

                                    <div class="mi-control-cantidad" th:if="${qtyInCart != null && qtyInCart > 0}">
                                        <button class="mi-btn-circulo" th:onclick="'updateCardQty(' + ${safeId} + ', -1)'">-</button>
                                        <span class="mi-numero-cantidad" th:id="'card-qty-val-' + ${safeId}" th:text="${qtyInCart}">1</span>
                                        <button class="mi-btn-circulo" th:onclick="'updateCardQty(' + ${safeId} + ', 1)'">+</button>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>

                <!-- Fin del Scroll -->
                <div class="row" th:if="${currentPage == totalPages - 1 and totalPages > 0}">
                    <div class="col-md-12 text-center" style="margin-top: 60px; margin-bottom: 20px; opacity: 0.5;">
                        <p style="font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: #999;">
                            <i class="fa fa-circle" style="font-size: 6px; vertical-align: middle; margin-right: 10px; color: #e69500;"></i>
                            Has llegado al final
                            <i class="fa fa-circle" style="font-size: 6px; vertical-align: middle; margin-left: 10px; color: #e69500;"></i>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<div th:replace="~{fragments :: footer-principal}"></div>

<div class="cart-overlay" onclick="toggleCart()"></div>
<div th:replace="~{fragments :: sideCartPanel}"></div>

<script th:src="@{/assets/js/cart-logic.js}"></script>

</body>
</html>
