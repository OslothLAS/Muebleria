<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso Denegado | Silvero</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700,900" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">

    <style>
        body {
            background-color: #ededed;
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
        }

        .access-denied-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        .access-denied-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 60px 50px;
            text-align: center;
            max-width: 520px;
            width: 100%;
        }

        .error-code {
            font-size: 100px;
            font-weight: 900;
            color: #f0f0f0;
            line-height: 1;
            margin-bottom: 10px;
            letter-spacing: -3px;
        }

        .access-denied-icon {
            width: 100px;
            height: 100px;
            background-color: #fff3cd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px auto;
        }

        .access-denied-icon i {
            font-size: 48px;
            color: #e69500;
        }

        .access-denied-card h1 {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
        }

        .access-denied-card p {
            font-size: 15px;
            color: #777;
            line-height: 1.7;
            margin-bottom: 35px;
        }

        .access-denied-card p span {
            font-weight: 600;
            color: #e69500;
        }

        .btn-go-home {
            display: inline-block;
            background-color: #e69500;
            color: #fff;
            padding: 13px 40px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 15px;
            text-decoration: none;
            transition: background 0.3s;
            margin-bottom: 10px;
        }

        .btn-go-home:hover {
            background-color: #cc8400;
            color: #fff;
            text-decoration: none;
        }

        .divider-text {
            font-size: 13px;
            color: #aaa;
            margin: 25px 0 0 0;
        }

        .brand-logo {
            display: block;
            font-size: 28px;
            font-weight: 800;
            color: #e69500;
            text-decoration: none;
            margin-bottom: 30px;
        }

        .brand-logo span {
            color: #333;
        }
    </style>
</head>
<body>

<section class="access-denied-section">
    <div class="access-denied-card">

        <a href="/" class="brand-logo">Silvero<span>.</span></a>

        <div class="error-code">403</div>

        <div class="access-denied-icon">
            <i class="fa fa-lock"></i>
        </div>

        <h1>Acceso Denegado</h1>

        <p>
            No tenés permiso para ver esta página.<br>
        </p>

        <a href="/" class="btn-go-home">
            <i class="fa fa-home" style="margin-right: 8px;"></i>Volver al Inicio
        </a>

        <p class="divider-text">
            Si creés que esto es un error, contactá al administrador.
        </p>

    </div>
</section>

</body>
</html>
